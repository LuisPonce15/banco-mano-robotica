name: Firmware

on:
  push:
    paths: ["firmware/**", "fsr/firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "fsr/firmware/**"]
  workflow_dispatch:

jobs:
  compilar:
    name: Compilar (esp32 ${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "3.x (última)"
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketches: |
              - firmware/banco_prueba
              - firmware/banco_fase1
              - fsr/firmware/fsr_ensayo
          # El paquete 2.x solo se prueba con banco_prueba: banco_fase1 y
          # fsr_ensayo usan librerías actuales que piden el 3.x.
          - core: "2.0.17"
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 2.0.17
            sketches: |
              - firmware/banco_prueba
    steps:
      - uses: actions/checkout@v5

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: ${{ matrix.platforms }}
          libraries: |
            - name: FastAccelStepper
            - name: ArduinoJson
            - source-url: https://github.com/ESP32Async/AsyncTCP.git
            - source-url: https://github.com/ESP32Async/ESPAsyncWebServer.git
          sketch-paths: ${{ matrix.sketches }}
          enable-deltas-report: false
          enable-warnings-report: true
